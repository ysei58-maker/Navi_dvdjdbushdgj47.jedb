<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Navi</title>
  <link rel="stylesheet" href="https://cloudflare.com" />
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background: #111; color: #fff; overflow: hidden; }
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #1e293b; }
    #ui-top { position: fixed; top: 15px; left: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
    #status { font-size: 15px; font-weight: bold; color: #4ade80; text-align: center; }
    .controls { display: flex; gap: 6px; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 15px; color: #000; background: #fff; }
    button { padding: 10px 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; background: #2563eb; color: #fff; }
    #btn-start { background: #16a34a; width: 100%; font-size: 16px; padding: 12px; }
  </style>
</head>
<body>

<div id="ui-top">
  <div id="status">「ナビ起動」を押してください</div>
  <button id="btn-start" onclick="initNavi()">① ナビ起動（音声ロック解除）</button>
  <div class="controls" id="search-box" style="display:none;">
    <input type="text" id="dest-input" placeholder="目的地名 または 地図をタップ">
    <button onclick="searchRoute()">検索</button>
  </div>
</div>

<div id="map"></div>

<script src="https://cloudflare.com"></script>
<script>
  let map, userMarker, destMarker, routeLine;
  let currentLat = null;
  let currentLon = null;
  let routeSteps = [];
  let currentStepIndex = 0;
  let announcedFlags = {};
  let isNavigating = false;

  function playAudioQueue(files) {
    if (!files || files.length === 0) return;
    let index = 0;
    function next() {
      if (index >= files.length) return;
      const file = files.at(index);
      index++;
      const audio = new Audio(file);
      audio.onended = next;
      audio.onerror = () => next();
      audio.play().catch(() => {});
    }
    next();
  }

  function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const p1 = lat1 * Math.PI / 180;
    const p2 = lat2 * Math.PI / 180;
    const dp = (lat2 - lat1) * Math.PI / 180;
    const dl = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  window.addEventListener('DOMContentLoaded', function() {
    map = L.map('map', { zoomControl: false }).setView([32.7525, 129.8705], 15);
    // 国土地理院の公式標準地図タイル（日本国内で高速・確実表示）
    L.tileLayer('https://gsi.go.jp{z}/{x}/{y}.png', {
      attribution: '地理院タイル',
      maxZoom: 18
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 300);

    map.on('click', function(e) {
      if (document.getElementById('search-box').style.display === 'none') return;
      calcRouteToCoords(e.latlng.lat, e.latlng.lng);
    });
  });

  function initNavi() {
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('search-box').style.display = 'flex';
    document.getElementById('status').innerText = "現在地を取得中...（地図タップで目的地設定可）";

    playAudioQueue(['Start_navigarion.mp3', 'Safety_Driving.mp3']);

    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(updatePosition, err => {
        document.getElementById('status').innerText = "GPS待機中（地図をタップして目的地設定できます）";
      }, { enableHighAccuracy: false, maximumAge: 30000, timeout: 30000 });
    }
  }

  function updatePosition(pos) {
    currentLat = pos.coords.latitude;
    currentLon = pos.coords.longitude;
    const latLng = L.latLng(currentLat, currentLon);

    if (!userMarker) {
      userMarker = L.circleMarker(latLng, { radius: 9, color: '#fff', fillColor: '#2563eb', fillOpacity: 1, weight: 3 }).addTo(map);
      map.setView(latLng, 17);
      if (!isNavigating) document.getElementById('status').innerText = "現在地を取得しました！";
    } else {
      userMarker.setLatLng(latLng);
      map.panTo(latLng);
    }

    if (isNavigating && routeSteps.length > 0) {
      checkNavigation(currentLat, currentLon);
    }
  }

  async function searchRoute() {
    const query = document.getElementById('dest-input').value.trim();
    if (!query) return alert("目的地を入力するか、地図をタップしてください");

    document.getElementById('status').innerText = "場所を検索中...";
    try {
      const url = `https://openstreetmap.org{encodeURIComponent(query)}&limit=1`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data || data.length === 0) {
        document.getElementById('status').innerText = "見つかりません。地図を直接タップしてください";
        return;
      }
      const first = data.at(0);
      calcRouteToCoords(parseFloat(first.lat), parseFloat(first.lon));
    } catch (e) {
      document.getElementById('status').innerText = "検索通信制限：地図上の目的地を直接タップしてください";
    }
  }

  async function calcRouteToCoords(destLat, destLon) {
    const startLat = currentLat !== null ? currentLat : 32.7525;
    const startLon = currentLon !== null ? currentLon : 129.8705;

    if (destMarker) map.removeLayer(destMarker);
    destMarker = L.marker([destLat, destLon]).addTo(map);

    document.getElementById('status').innerText = "ルートを計算中...";
    try {
      const routeUrl = `https://project-osrm.org{startLon},${startLat};${destLon},${destLat}?overview=full&geometries=geojson&steps=true`;
      const routeRes = await fetch(routeUrl);
      const routeData = await routeRes.json();

      if (routeData.routes && routeData.routes.length > 0) {
        const route = routeData.routes.at(0);
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.geoJSON(route.geometry, { style: { color: '#3b82f6', weight: 7 } }).addTo(map);
        map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

        routeSteps = route.legs.at(0).steps;
        currentStepIndex = 1;
        announcedFlags = {};
        isNavigating = true;

        document.getElementById('status').innerText = "案内を開始します";
        playAudioQueue(['Route_Setup_Complete.mp3', 'Follow_Road.mp3']);
      } else {
        document.getElementById('status').innerText = "ルートが見つかりませんでした";
      }
    } catch (e) {
      document.getElementById('status').innerText = "ルート計算エラー: " + e.message;
    }
  }

  function checkNavigation(lat, lng) {
    if (currentStepIndex >= routeSteps.length) return;

    const step = routeSteps.at(currentStepIndex);
    const targetLon = step.maneuver.location.at(0);
    const targetLat = step.maneuver.location.at(1);
    const dist = Math.round(getDistance(lat, lng, targetLat, targetLon));

    const actionFile = getActionAudio(step.maneuver);
    document.getElementById('status').innerText = `次の案内まで 約${dist}m`;

    if (step.maneuver.type === 'arrive' && dist <= 40 && !announcedFlags.arrive) {
      announcedFlags.arrive = true;
      isNavigating = false;
      document.getElementById('status').innerText = "目的地周辺に到着しました";
      playAudioQueue(['Destination_arrived.mp3']);
      return;
    }

    const thresholds = [
      { d: 1500, file: '1.5km.mp3' },
      { d: 1000, file: '1km.mp3' },
      { d: 800,  file: '800m.mp3' },
      { d: 400,  file: '400m.mp3' },
      { d: 200,  file: '200m.mp3' }
    ];

    for (let t of thresholds) {
      const key = `step_${currentStepIndex}_${t.d}`;
      if (dist <= t.d && dist > t.d - 80 && !announcedFlags[key]) {
        announcedFlags[key] = true;
        if (actionFile) playAudioQueue([t.file, actionFile]);
        break;
      }
    }

    const turnKey = `turn_${currentStepIndex}`;
    if (dist <= 40 && !announcedFlags[turnKey]) {
      announcedFlags[turnKey] = true;
      if (actionFile) playAudioQueue([actionFile]);
      currentStepIndex++;
    }
  }

  function getActionAudio(maneuver) {
    const mod = maneuver.modifier || '';
    if (mod.includes('uturn')) return 'U_Turn.mp3';
    if (mod.includes('left')) return 'TurnLeft.mp3';
    if (mod.includes('right')) return 'TurnRight.mp3';
    if (maneuver.type === 'continue' || mod.includes('straight')) return 'Follow_Road.mp3';
    return null;
  }
</script>
</body>
</html>
